# วางไฟล์นี้ที่ app/compose.yaml (ข้าง ๆ โฟลเดอร์ api/ และ web/)
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้งค่าใน .env}
      POSTGRES_DB: todo
    volumes:
      - pgdata:/var/lib/postgresql   # Postgres 18+ ใช้ path นี้ (ไม่ใช่ .../data)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    image: ${API_IMAGE:-todo-api}:${TAG:-latest}
    environment:
      DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD}@db:5432/todo
      APP_VERSION: ${TAG:-dev}
    depends_on:
      db:
        condition: service_healthy   # รอให้ DB พร้อมจริง ไม่ใช่แค่ container start
    restart: unless-stopped

  web:
    build: ./web
    image: ${WEB_IMAGE:-todo-web}:${TAG:-latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
