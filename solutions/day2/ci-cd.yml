# วางไฟล์นี้ที่ .github/workflows/ci-cd.yml ใน repo ของนักศึกษา
# ต้องตั้งค่าใน GitHub → Settings → Secrets and variables → Actions
#   Variables: DEPLOY_HOST, DEPLOY_PORT, DEPLOY_USER
#   Secrets:   SSH_KEY (private key ที่ public key อยู่ใน ~/.ssh/authorized_keys ของ server)
# บน server: สร้าง ~/todo/.env (มี POSTGRES_PASSWORD และ WEB_PORT=80) ไว้ล่วงหน้าหนึ่งครั้ง
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7
      - id: image
        # ชื่อ image ต้องเป็นตัวพิมพ์เล็ก: ghcr.io/<owner>/<repo>-api
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: app/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    # ข้ามขั้น deploy ถ้ายังไม่ได้ตั้งค่า server
    if: github.event_name == 'push' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read   # ให้ GITHUB_TOKEN ใช้ pull image บน server ได้
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      PORT: ${{ vars.DEPLOY_PORT || '22' }}
      USER: ${{ vars.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts
      - name: Deploy with docker compose
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh -p "$PORT" "$USER@$HOST" "mkdir -p ~/todo"
          scp -P "$PORT" app/compose.yaml "$USER@$HOST:~/todo/compose.yaml"
          ssh -p "$PORT" "$USER@$HOST" "
            set -e
            cd ~/todo
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            export TAG='${{ github.sha }}' API_IMAGE='$IMAGE-api' WEB_IMAGE='$IMAGE-web'
            docker compose pull api web
            docker compose up -d --no-build
            docker image prune -f
          "
